name: Actualizar precios

on:
  schedule:
    - cron: "17 10 * * *"   # todos los días, 10:17 UTC (07:17 en Santiago, horario de verano)
  workflow_dispatch:         # botón "Run workflow" para ejecutarlo a mano
  push:
    paths:
      - "scripts/update_cards.py"
      - ".github/workflows/update-prices.yml"

permissions:
  contents: write

concurrency:
  group: update-prices
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generar data/cards.json
        run: python scripts/update_cards.py

      - name: Guardar cambios
        run: |
          if git diff --quiet -- data/cards.json && git ls-files --error-unmatch data/cards.json >/dev/null 2>&1; then
            echo "Sin cambios en los precios."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/cards.json
          git commit -m "Precios actualizados $(date -u +%Y-%m-%d)"
          git push
